name: US Market Strength Radar V4

on:
  workflow_dispatch:
  schedule:
    # US trading weekdays, after the regular close (22:00 UTC).
    - cron: "0 22 * * 1-5"

permissions:
  contents: read

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore seven-day industry metadata cache
        uses: actions/cache@v4
        with:
          path: .cache/market_metadata.json
          key: market-radar-metadata-${{ github.run_id }}
          restore-keys: |
            market-radar-metadata-

      - name: Run V4 radar and send daily report
        env:
          # Keep all delivery details in repository Secrets.  The code has
          # safe defaults only for local development; production never
          # hard-codes an address or provider here.
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SUBJECT: ${{ secrets.EMAIL_SUBJECT }}
        run: python radar.py --send-email

      - name: Show compact daily report in log
        if: always()
        run: cat output/market_radar_report.txt || true

      - name: Upload V4 radar artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-strength-radar-v4
          path: |
            output/market_leaders.csv
            output/sector_strength.csv
            output/watchlist.csv
            output/market_radar_report.md
            output/market_radar_report.txt
          if-no-files-found: warn
